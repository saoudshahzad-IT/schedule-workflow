
name: Scheduled Task

on:
  schedule:
    # Run every day at 9:00 AM Pakistan time (04:00 UTC)
    - cron: "0 4 * * *"

  # Allow manual execution from GitHub
  workflow_dispatch:

jobs:
  scheduled-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display execution time
        run: |
          echo "Scheduled task started"
          date -u

      - name: Run task script
        run: |
          echo "Execute your task here"
          # Example: python scripts/task.py
